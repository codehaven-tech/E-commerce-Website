
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:linear-gradient(135deg,#f8f9fa,#e9ecef);
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#222;
}

.cart-item{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.cart-item img{
    width:120px;
    height:120px;
    object-fit:contain;
}

.cart-details{
    flex:1;
}

.cart-details h3{
    margin-bottom:10px;
}

.cart-details p{
    color:green;
    font-weight:bold;
    font-size:18px;
}

.remove-btn{
    background:#dc3545;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.remove-btn:hover{
    background:#b02a37;
}

.total-box{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    text-align:center;
}

.checkout-btn{
    background:black;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:15px;
}

.clear-btn{
    background:#ff9800;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    margin-left:10px;
}

.empty{
    text-align:center;
    font-size:22px;
    color:#666;
}

@media(max-width:768px){

    .cart-item{
        flex-direction:column;
        text-align:center;
    }

}

</style>
</head>

<body>

<h1>🛒 My Shopping Cart</h1>

<div id="cartContainer"></div>

<div class="total-box">

    <h2 id="total">Total : ₹0</h2>

    <br>

    <a href="checkout.html">
        <button class="checkout-btn">
            Proceed To Checkout
        </button>
    </a>

    <button class="clear-btn" onclick="clearCart()">
        Clear Cart
    </button>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const container = document.getElementById("cartContainer");

function renderCart(){

    container.innerHTML = "";

    let total = 0;

    if(cart.length === 0){

        container.innerHTML =
        "<h2 class='empty'>Your Cart Is Empty 🛒</h2>";

        document.getElementById("total").innerHTML =
        "Total : $0";

        return;
    }

    cart.forEach((item,index)=>{

        total += Number(item.price);

        container.innerHTML += `
        <div class="cart-item">

            <img src="${item.image}" alt="${item.name}">

            <div class="cart-details">

                <h3>${item.name}</h3>

                <p>$${item.price}</p>

            </div>

            <button
            class="remove-btn"
            onclick="removeItem(${index})">
            ❌ Remove
            </button>

        </div>
        `;
    });

    document.getElementById("total").innerHTML =
    "Total : $" + total;
}

function removeItem(index){

    cart.splice(index,1);

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    renderCart();
}

function clearCart(){

    localStorage.removeItem("cart");

    cart = [];

    renderCart();
}

renderCart();

</script>

</body>
</html>
