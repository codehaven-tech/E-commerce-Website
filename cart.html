<!DOCTYPE html>
<html>
<head>
<title>My Cart</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:linear-gradient(135deg,#f8f9fa,#e9ecef);
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#222;
}

.cart-item{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    transition:0.3s;
    animation:fadeIn 0.5s ease;
}

.cart-item:hover{
    transform:translateY(-5px);
}

.cart-item h3{
    margin-bottom:10px;
}

.cart-item p{
    color:green;
    font-weight:bold;
    margin-bottom:10px;
}

.remove-btn{
    background:#dc3545;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:8px;
    cursor:pointer;
}

.remove-btn:hover{
    background:#b02a37;
}

.total-box{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.checkout-btn{
    background:black;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:15px;
    transition:0.3s;
}

.checkout-btn:hover{
    transform:scale(1.05);
}

.clear-btn{
    background:#ff9800;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    margin-left:10px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

</head>

<body>

<h1>🛒 My Shopping Cart</h1>

<div id="cartContainer"></div>

<div class="total-box">
    <h2 id="total"></h2>

    <a href="checkout.html">
        <button class="checkout-btn">
            Proceed To Checkout
        </button>
    </a>

    <button class="clear-btn" onclick="clearCart()">
        Clear Cart
    </button>
</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let container = document.getElementById("cartContainer");

let total = 0;

function renderCart(){

    container.innerHTML="";
    total=0;

    cart.forEach((item,index)=>{

        total += item.price;

        container.innerHTML += `
        <div class="cart-item">

            <h3>${item.name}</h3>

            <p>₹ ${item.price}</p>

            <button
            class="remove-btn"
            onclick="removeItem(${index})">
            ❌ Remove
            </button>

        </div>
        `;
    });

    document.getElementById("total").innerHTML =
    "Total : ₹ " + total;
}

function removeItem(index){

    cart.splice(index,1);

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    renderCart();
}

function clearCart(){

    localStorage.removeItem("cart");

    cart=[];

    renderCart();
}

renderCart();

</script>

</body>
</html>
